# Claude Desktop on TrueNAS (Docker Compose)
#
# Drop this file into a TrueNAS dataset (e.g. /mnt/tank/apps/claude-desktop)
# along with Dockerfile, entrypoint.sh, and openbox-rc.xml. From the TrueNAS
# Apps -> Custom App UI, point it at this compose, or run via dockge/portainer.
#
# After "docker compose up -d", open in any browser:
#   http://<truenas-host>:6080/vnc.html?autoconnect=1&resize=remote
#
# First-run: log in to your Claude account in the GUI. The session persists in
# the bind-mounted ./config directory, so restarts keep you signed in.

services:
  claude-desktop:
    # Image is built by .github/workflows/build-publish.yml and pushed to GHCR.
    # Pin to :latest for auto-updates, or to a :sha-xxxxxxx tag for reproducibility.
    # If you'd rather build locally on the TrueNAS host, see README / project docs:
    # comment the `image:` line, uncomment the `build:` block, and run
    # `docker compose build` over SSH (Portainer can't build — it has no $HOME).
    image: ghcr.io/japatton/claude-desktop:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: claude-desktop
    hostname: claude-desktop
    restart: unless-stopped

    ports:
      # noVNC web UI. Change the host side if 6080 is taken on the TrueNAS box.
      - "6080:6080"

    environment:
      # Match these to the dataset owner (find with `ls -n` on the host path).
      # On TrueNAS, the apps user is typically 568:568 — adjust if you bind
      # to a dataset owned by a different user.
      PUID: "1000"
      PGID: "1000"
      TZ: "America/New_York"
      SCREEN_GEOMETRY: "1920x1080x24"
      # Set a password to require auth on the noVNC page. Leave blank for none
      # (only safe if the port is firewalled or behind a reverse proxy).
      VNC_PASSWORD: ""

    volumes:
      # Claude Desktop config + chat history + MCP server config.
      # Replace ./config with a TrueNAS dataset path, e.g.
      #   /mnt/tank/apps/claude-desktop/config:/home/claude/.config/Claude
      - ./config:/home/claude/.config/Claude
      # Optional: expose host files to MCP filesystem servers running inside
      # the container. Uncomment and point to whatever you want Claude to see.
      # - /mnt/tank/projects:/home/claude/projects

    # Electron + Chromium need a decent /dev/shm or tabs crash.
    shm_size: "1gb"

    # Healthcheck: noVNC's HTTP endpoint should respond once everything's up.
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/6080 && echo -e 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
